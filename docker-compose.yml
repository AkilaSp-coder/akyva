version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: akyva-postgres
    restart: always
    environment:
      POSTGRES_DB: akyva_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d akyva_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: akyva-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/akyva_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      JWT_SECRET: akyva_super_secret_jwt_key_2026_at_least_256_bits_length_for_hmac_sha
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akyva-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - backend

volumes:
  postgres_data:
